name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfltk1.3-dev xvfb imagemagick
      - run: make -j"$(nproc)"
      # geometry/math unit tests, then the real program under xvfb with a screenshot check
      - run: make test
